# Supabase project configuration.
#
# Committed so `supabase start` and `supabase db reset` behave the same on
# every machine, and so the settings this app depends on for its security model
# are reviewed in pull requests rather than clicked in a dashboard and
# forgotten. Anything set here for the local stack must also be set on the
# hosted project — the dashboard is the source of truth there, and §2 of
# docs/deployment.md lists what to check.

project_id = "ryla-verify"

[api]
enabled = true
port = 54321
schemas = ["public"]
# `app` is deliberately absent. It holds the SECURITY DEFINER helpers that RLS
# is built on; exposing it over PostgREST would let a client call them directly.
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
# Match the hosted project. A migration that works on 16 and not on 15 is a
# failure discovered at deploy time.
major_version = 16

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
# An evidence photograph is ~230 KB and a manifest is a few hundred rows.
# 10 MB is generous for both and small enough that a runaway upload is not a
# bill. The client enforces the same limit; this is the one that counts.
file_size_limit = "10MiB"

[auth]
enabled = true
# Set these to the real thing on the hosted project. A wrong site_url sends
# password-reset links to a domain nobody controls.
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]

# THE setting. Drivers and managers are created by an administrator; a yard
# verification system that anyone can sign up to is a yard verification system
# that verifies nothing. Confirm it is off on the hosted project too — this
# file does not reach it.
enable_signup = false

jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.email]
enable_signup = false
# A driver at a ramp in the rain cannot check email. Accounts are created and
# confirmed by an administrator.
enable_confirmations = false
double_confirm_changes = true

[analytics]
enabled = false
